# Blueprint de deploy no Render (https://render.com) — plano gratuito, sem cartão.
# Provisiona um Postgres gratuito e sobe a loja, tudo automático.
databases:
  - name: loja-db
    plan: free
    databaseName: loja
    user: loja

services:
  - type: web
    name: loja-checkout
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:prod
    envVars:
      - key: JWT_SECRET
        generateValue: true            # o Render gera um segredo forte sozinho
      - key: DATABASE_URL
        fromDatabase:
          name: loja-db
          property: connectionString   # conecta na base Postgres acima
      - key: NODE_VERSION
        value: "20"
